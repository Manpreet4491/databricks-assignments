# This is a Declarative Automation Bundle definition for day_9_DABs.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: day_9_DABs
  uuid: c4ea0f3f-6bb8-4515-b798-b640906d68bd

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073 
    variables:
      catalog: dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/botmanpreet2021@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/botmanpreet2021@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: botmanpreet2021@gmail.com
        level: CAN_MANAGE
